name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não bloqueante: a base atual tem pendências de lint que serão
      # tratadas em PR próprio. Remover continue-on-error ao zerar o backlog.
      - name: Lint
        run: npm run lint:check
        continue-on-error: true

      - name: Build da aplicação
        run: npm run build

      - name: Testes automatizados (com cobertura)
        run: npm run test:cov

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  docker-image:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem (validação em PR)
        if: github.event_name == 'pull_request'
        run: docker build -t "oficina-mecanica-api:${{ steps.meta.outputs.tag }}" .

      - name: Configurar credenciais AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push para o ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ -z "${ECR_REPOSITORY_URL}" ]]; then
            echo "Variável ECR_REPOSITORY_URL não configurada (Settings > Secrets and variables > Actions > Variables)." >&2
            echo "Use o output 'ecr_repository_url' do Terraform. Ver docs/ci-cd.md." >&2
            exit 1
          fi
          docker build \
            -t "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" \
            -t "${ECR_REPOSITORY_URL}:latest" \
            .
          docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URL}:latest"

  deploy:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name != 'pull_request'
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      KUBERNETES_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'oficina-mecanica' }}
      POSTGRES_HOST: ${{ vars.RDS_HOST }}
      TF_VAR_db_name: ${{ vars.DB_NAME || 'oficina_mecanica' }}
      TF_VAR_db_username: ${{ vars.DB_USERNAME || 'oficina' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      API_IMAGE_TAG: ${{ needs.docker-image.outputs.image-tag }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICACAO_EMAIL_MECANICOS: ${{ vars.NOTIFICACAO_EMAIL_MECANICOS }}
      NOTIFICACAO_EMAIL_ADMIN: ${{ vars.NOTIFICACAO_EMAIL_ADMIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # envsubst substitui variáveis não definidas por string vazia sem
      # falhar; validar aqui evita aplicar manifestos com Secret em branco.
      - name: Validar configuração do pipeline
        run: |
          missing=()
          for v in AWS_REGION CLUSTER_NAME ECR_REPOSITORY_URL KUBERNETES_NAMESPACE \
                    POSTGRES_HOST TF_VAR_db_name TF_VAR_db_username TF_VAR_db_password \
                    TF_VAR_jwt_secret RESEND_API_KEY NOTIFICACAO_EMAIL_MECANICOS \
                    NOTIFICACAO_EMAIL_ADMIN API_IMAGE_TAG; do
            [[ -n "${!v:-}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "Variáveis/segredos ausentes no GitHub Actions: ${missing[*]}" >&2
            echo "Configure em Settings > Secrets and variables > Actions. Ver docs/ci-cd.md." >&2
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Renderizar manifestos Kubernetes
        run: |
          source ./infra/load-k8s-template-vars.sh
          bash ./infra/prepare-k8s-overlay.sh
          bash ./infra/render-k8s-overlay.sh
          {
            echo "API_NAME=${API_NAME}"
            echo "KUBERNETES_NAMESPACE=${KUBERNETES_NAMESPACE}"
          } >> "$GITHUB_ENV"

      - name: Aplicar manifestos no cluster
        run: kubectl apply -k k8s/overlays/generated

      - name: Deploy do banco de dados (migrations)
        run: bash ./infra/run-db-migrations.sh

      - name: Aguardar rollout da API
        run: |
          kubectl -n "${KUBERNETES_NAMESPACE}" rollout status \
            "deployment/${API_NAME}" --timeout=5m

      - name: Smoke test
        run: |
          host="$(kubectl -n "${KUBERNETES_NAMESPACE}" get service "${API_NAME}" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          if [[ -z "${host}" ]]; then
            echo "LoadBalancer ainda sem hostname público; pulando smoke test."
            exit 0
          fi
          echo "Testando http://${host}/api/v1/health"
          for _ in $(seq 1 30); do
            if curl -sf "http://${host}/api/v1/health" >/dev/null; then
              echo "API saudável em http://${host}"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test falhou: API não respondeu no health check." >&2
          exit 1
