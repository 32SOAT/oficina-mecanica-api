apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args:
            - run
            - /scripts/load-test.js
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
