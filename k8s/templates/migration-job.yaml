apiVersion: batch/v1
kind: Job
metadata:
  name: ${API_NAME}-migrations
  namespace: ${KUBERNETES_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${API_NAME}
    app.kubernetes.io/instance: ${APP_INSTANCE}
    app.kubernetes.io/part-of: ${PROJECT_NAME}
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${API_NAME}
        app.kubernetes.io/instance: ${APP_INSTANCE}
        app.kubernetes.io/part-of: ${PROJECT_NAME}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: ${ECR_REPOSITORY_URL}:${API_IMAGE_TAG}
          imagePullPolicy: ${API_IMAGE_PULL_POLICY}
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/database/data-source.js
          envFrom:
            - configMapRef:
                name: ${API_NAME}-config
            - secretRef:
                name: ${API_NAME}-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
