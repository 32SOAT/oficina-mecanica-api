apiVersion: apps/v1
kind: Deployment
metadata:
  name: fase2-kubernetes-oficina-mecanica-api
spec:
  replicas: ${API_REPLICAS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${API_NAME}
        app.kubernetes.io/instance: ${APP_INSTANCE}
        app.kubernetes.io/part-of: ${PROJECT_NAME}
    spec:
      containers:
        - name: fase2-kubernetes-oficina-mecanica-api
          imagePullPolicy: ${API_IMAGE_PULL_POLICY}
          readinessProbe:
            httpGet:
              path: ${API_HEALTHCHECK_PATH}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: ${API_HEALTHCHECK_PATH}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: ${API_HEALTHCHECK_PATH}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
